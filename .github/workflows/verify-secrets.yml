name: Verify release secrets
on: workflow_dispatch
permissions: {}
jobs:
  verify:
    runs-on: macos-latest
    env:
      KEYCHAIN: ${{ runner.temp }}/verify.keychain-db
    steps:
      - name: Developer ID certificate (.p12 + password)
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          KC_PASS="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -q 'Developer ID Application: Rework Labs (FDRSA4WESN)' \
            && echo "✅ Developer ID identity + private key imported" \
            || { echo "❌ Developer ID identity not found in .p12"; exit 1; }

      - name: App Store Connect API key (notarization)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: |
          printf '%s' "$ASC_P8" > "$RUNNER_TEMP/key.p8"
          xcrun notarytool history --key "$RUNNER_TEMP/key.p8" \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" >/dev/null \
            && echo "✅ notarytool authenticated" \
            || { echo "❌ notarytool rejected the API key / IDs"; rm -f "$RUNNER_TEMP/key.p8"; exit 1; }
          rm -f "$RUNNER_TEMP/key.p8"

      - name: Sparkle private key matches SUPublicEDKey
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          EXPECTED_PUBLIC: JW7rzXWpIcQ/rGW5bL+bghZeprOyK3KyPAmwESBGpq0=
        run: |
          python3 -m pip install --quiet cryptography
          python3 - <<'PY'
          import base64, os, sys
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization
          raw = base64.b64decode(os.environ["SPARKLE_KEY"].strip())
          if len(raw) == 32:      # current Sparkle export: 32-byte seed
              pub = Ed25519PrivateKey.from_private_bytes(raw).public_key().public_bytes(
                  serialization.Encoding.Raw, serialization.PublicFormat.Raw)
          elif len(raw) == 96:    # legacy export: private (64) + public (32)
              pub = raw[64:]
          else:
              sys.exit(f"❌ unexpected Sparkle key length {len(raw)}")
          if base64.b64encode(pub).decode() != os.environ["EXPECTED_PUBLIC"]:
              sys.exit("❌ Sparkle private key does NOT match SUPublicEDKey")
          print("✅ Sparkle private key matches SUPublicEDKey")
          PY

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
